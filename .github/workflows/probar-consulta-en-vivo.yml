name: Probar consulta en vivo a la DIAN
on:
  push:
    branches: [feat/consulta-dian-en-vivo]
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python dian_prueba_en_vivo.py | tee -a "$GITHUB_STEP_SUMMARY"
