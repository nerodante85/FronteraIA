name: Verificar aranceles contra la DIAN

on:
  schedule:
    - cron: "0 13 1 * *"   # día 1 de cada mes, 8:00 a. m. en Colombia
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Comparar el CSV con la Consulta de Arancel de la DIAN
        run: python dian_verificador.py | tee -a "$GITHUB_STEP_SUMMARY"
